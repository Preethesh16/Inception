[project]
name = "inception-medical"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "sqlalchemy>=2.0,<3", "alembic>=1.14,<2", "pydantic>=2.10,<3", "pandas>=2.2,<3", "numpy>=2,<3", "python-multipart>=0.0.20", "python-dotenv>=1.0", "openai>=1.70,<3", "pyyaml>=6"]
[project.optional-dependencies]
forecast = ["chronos-forecasting>=2.0,<3", "torch>=2.2,<3"]
dev = ["pytest>=8", "httpx>=0.28", "ruff>=0.11"]
[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]
[tool.ruff]
line-length = 110
[tool.setuptools.packages.find]
where = ["backend"]
